<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Marine Term Translations</title>
  </head>
  <body>
    <!-- This file is a fallback for GitHub Pages when a page is not found -->
    <div id="root"></div>
    <script type="text/javascript">
      // Simple redirect for HashRouter apps
      // Redirects any 404 path to the hash route format that HashRouter expects
      var l = window.location;
      var redirectPath = l.pathname + (l.search || '') + (l.hash || '');
      
      // Redirect to root with hash routing
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/#' + redirectPath);
    </script>
  </body>
</html>
